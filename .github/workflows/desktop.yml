# Builds the desktop installers (Windows .exe, macOS universal .dmg).
#
#   - Push a tag like desktop-v0.2.0  → builds both and publishes a GitHub Release.
#     The website's download links point at the latest release, so they update by themselves.
#   - "Run workflow" from the Actions tab → builds both as downloadable artifacts only.
#
# Optional repository variable OCAK_SERVER_URL bakes your server address into the app.
name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: desktop/release/Ocak-Setup.exe
          - os: macos-latest
            script: dist:mac
            files: desktop/release/Ocak.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}"

      - name: Bake in the server address
        if: ${{ vars.OCAK_SERVER_URL != '' }}
        run: npm pkg set ocak.serverUrl="${{ vars.OCAK_SERVER_URL }}"

      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned build

      - uses: actions/upload-artifact@v4
        with:
          name: ocak-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Ocak desktop ${{ github.ref_name }}
          files: |
            dist/Ocak-Setup.exe
            dist/Ocak.dmg
          make_latest: true
          body: |
            **Windows:** download `Ocak-Setup.exe` and run it. SmartScreen may warn because the app isn't code-signed; click *More info → Run anyway*.
            **macOS:** download `Ocak.dmg` (works on Apple Silicon and Intel), drag Ocak to Applications, then right-click → *Open* the first time.

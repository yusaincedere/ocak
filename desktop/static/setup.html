<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:" />
    <title>Ocak</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 16px;
        background: #111214; color: #e9e9ec;
        font: 15px/1.45 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      form {
        width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px;
        padding: 32px; background: #17181b; border: 1px solid #2a2c31; border-radius: 16px;
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
      h1 { margin: 4px 0 0; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; color: #a4a6ad; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.06em; color: #a4a6ad; }
      input { padding: 11px 12px; border-radius: 8px; border: 1px solid #2a2c31; background: #111214;
        color: #e9e9ec; font: inherit; font-size: 15px; text-transform: none; letter-spacing: normal; }
      input:focus { outline: 2px solid #e8ff5a; outline-offset: -1px; }
      button { border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer; font: inherit;
        font-weight: 600; background: #e8ff5a; color: #111214; }
      .error { color: #ff5a5f; font-size: 14px; }
    </style>
  </head>
  <body>
    <form id="f">
      <div class="brand"><img src="../build/icon.png" width="32" height="32" alt="" style="border-radius:8px" /> ocak</div>
      <h1 data-t="title">Connect to your server</h1>
      <p data-t="intro">Enter the address of your Ocak server.</p>
      <label>
        <span data-t="address">Server address</span>
        <input id="url" placeholder="chat.example.com" autofocus required />
      </label>
      <p id="error" class="error" hidden></p>
      <button data-t="connect">Connect</button>
    </form>
    <script>
      const q = new URLSearchParams(location.search);
      // Translated labels come from the app (see desktop/src/i18n.ts).
      try {
        const s = JSON.parse(q.get('s') || '{}');
        for (const el of document.querySelectorAll('[data-t]')) if (s[el.dataset.t]) el.textContent = s[el.dataset.t];
        if (q.get('lang')) document.documentElement.lang = q.get('lang');
      } catch {}
      const err = document.getElementById('error');
      const input = document.getElementById('url');
      if (q.get('error')) { err.textContent = q.get('error'); err.hidden = false; }
      window.ocakDesktop?.getSettings().then((s) => { if (s && s.serverUrl) input.value = s.serverUrl; });
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        const res = await window.ocakDesktop.connect(input.value);
        if (!res.ok) { err.textContent = res.error; err.hidden = false; }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self' file:" />
    <title>Ocak remote control</title>
    <style>
      /* The app's typeface, bundled in fonts/ (SIL Open Font License, see fonts/OFL.txt). */
      @font-face { font-family: 'Bricolage Grotesque Variable'; font-weight: 200 800; font-display: swap;
        src: url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format('woff2-variations'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'Bricolage Grotesque Variable'; font-weight: 200 800; font-display: swap;
        src: url(fonts/bricolage-grotesque-latin-ext-opsz-normal.woff2) format('woff2-variations'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
      body { font: 600 13px/1 'Bricolage Grotesque Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .bar {
        margin: 2px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px;
        border-radius: 999px; background: #e5383b; color: #fff;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; flex-shrink: 0; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      .text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hint { opacity: 0.8; font-weight: 500; }
      button {
        border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer;
        background: #fff; color: #c1121f; font: inherit;
      }
      button:hover { background: #ffe5e5; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="dot"></span>
      <span class="text"><span id="msg"></span> <span class="hint" id="hint"></span></span>
      <button id="stop"></button>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      // The app passes the finished, translated text; names only ever go through textContent.
      document.documentElement.lang = q.get('lang') || 'tr';
      document.getElementById('msg').textContent = q.get('text') || '';
      document.getElementById('stop').textContent = q.get('stop') || 'Stop';
      document.getElementById('hint').textContent = q.get('shortcut') ? `· ${q.get('shortcut')}` : '';
      document.getElementById('stop').onclick = () => ocakBanner.stop();
    </script>
  </body>
</html>

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: http://localhost:* http://127.0.0.1:*" />
    <title>Ocak overlay</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
      body { font: 13px/1.3 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e9e9ec; }
      #panel {
        margin: 1px; border-radius: 12px; overflow: hidden;
        background: rgba(17, 18, 20, 0.9); border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
      }
      header {
        display: flex; align-items: center; gap: 8px; padding: 8px 6px 6px 10px;
        -webkit-app-region: drag; cursor: grab;
      }
      .live { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
      #room { flex: 1; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; color: #a4a6ad; }
      button {
        -webkit-app-region: no-drag; border: 0; background: transparent; color: #a4a6ad; cursor: pointer;
        display: inline-grid; place-items: center; border-radius: 7px; padding: 0;
      }
      button:hover { background: rgba(255, 255, 255, 0.08); color: #e9e9ec; }
      header button { width: 22px; height: 22px; }
      ul { list-style: none; margin: 0; padding: 0 6px 4px; }
      li { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px; }
      .av {
        width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
        background: #2c2f35; font-size: 10px; font-weight: 700; color: #e9e9ec; transition: box-shadow 0.12s;
      }
      .av { position: relative; overflow: hidden; }
      .av img { position: absolute; max-width: none; pointer-events: none; }
      li.speaking .av { box-shadow: 0 0 0 2px #111214, 0 0 0 3.5px #4ade80; }
      li.speaking .name { color: #fff; }
      .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9cad0; }
      .flags { display: flex; gap: 4px; color: #ff5a5f; }
      .tag { font-size: 9px; font-weight: 800; padding: 0 4px; border-radius: 3px; background: #ff5a5f; color: #fff; }
      .more { padding: 2px 8px 4px; color: #6d7078; font-size: 12px; }
      footer { display: flex; gap: 4px; padding: 6px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
      footer button { flex: 1; height: 30px; background: rgba(255, 255, 255, 0.05); color: #e9e9ec; }
      footer button.off { background: rgba(255, 90, 95, 0.18); color: #ff5a5f; }
      footer button.leave { flex: 0 0 44px; background: #ff5a5f; color: #fff; }
      footer button.leave:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div id="panel">
      <header>
        <span class="live"></span>
        <span id="room"></span>
        <button id="open"></button>
      </header>
      <ul id="people"></ul>
      <footer>
        <button id="mute"></button>
        <button id="deafen"></button>
        <button id="leave" class="leave"></button>
      </footer>
    </div>
    <script>
      // Icons are constant strings; participant names are only ever set via textContent.
      const svg = (d, s = 15) =>
        `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      const I = {
        mic: svg('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>'),
        micOff: svg('<path d="M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 5.1 2.1M19 10a7 7 0 0 1-1.1 3.8M5 10a7 7 0 0 0 11.2 5.6M12 17v5M3 3l18 18"/>'),
        head: svg('<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/>'),
        headOff: svg('<path d="M3 18v-6a9 9 0 0 1 14.7-7M21 12v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3zM3 3l18 18"/>'),
        leave: svg('<path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3 4.2 2 2 0 0 1 5 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8.9 9.7"/><path d="M22 2 2 22"/>'),
        open: svg('<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>', 13),
        smallOff: svg('<path d="M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 5.1 2.1M19 10a7 7 0 0 1-1.1 3.8M5 10a7 7 0 0 0 11.2 5.6M12 17v5M3 3l18 18"/>', 12),
      };
      const $ = (id) => document.getElementById(id);
      $('open').innerHTML = I.open;
      $('leave').innerHTML = I.leave;
      $('open').onclick = () => ocakOverlay.act('open');
      $('mute').onclick = () => ocakOverlay.act('toggle-mute');
      $('deafen').onclick = () => ocakOverlay.act('toggle-deafen');
      $('leave').onclick = () => ocakOverlay.act('leave');

      // Labels arrive from the app in its language (Turkish until told otherwise).
      let T = { mute: 'Sessize al', unmute: 'Sesi aç', deafen: 'Sağırlaştır', undeafen: 'Sağırlaştırmayı kapat', leave: 'Görüşmeden ayrıl', open: "Ocak'ı aç", you: '(sen)', more: '+{n} kişi daha', live: 'CANLI' };
      let last = null;
      function applyStrings(s) {
        T = { ...T, ...s };
        $('open').title = T.open;
        $('leave').title = T.leave;
        render(last);
      }

      const MAX = 8;
      function render(s) {
        last = s;
        if (!s) return;
        $('room').textContent = s.roomId;
        $('mute').innerHTML = s.muted ? I.micOff : I.mic;
        $('mute').className = s.muted ? 'off' : '';
        $('mute').title = s.muted ? T.unmute : T.mute;
        $('deafen').innerHTML = s.deafened ? I.headOff : I.head;
        $('deafen').className = s.deafened ? 'off' : '';
        $('deafen').title = s.deafened ? T.undeafen : T.deafen;

        // Talking people first, then everyone else in join order.
        const people = [...s.participants].sort((a, b) => Number(b.speaking) - Number(a.speaking));
        const ul = $('people');
        ul.replaceChildren();
        for (const p of people.slice(0, MAX)) {
          const li = document.createElement('li');
          if (p.speaking) li.className = 'speaking';
          const av = document.createElement('span');
          av.className = 'av';
          av.textContent = (p.name || '?').trim().slice(0, 1).toUpperCase();
          // Profile picture (only URLs on our own server get here; the app checks them).
          const a = p.avatar;
          if (a && typeof a.src === 'string') {
            const side = a.zoom * Math.min(a.ar, 1);
            const img = document.createElement('img');
            img.alt = '';
            img.style.width = `${(a.ar / side) * 100}%`;
            img.style.height = `${(1 / side) * 100}%`;
            img.style.left = `${(0.5 - (a.x * a.ar) / side) * 100}%`;
            img.style.top = `${(0.5 - a.y / side) * 100}%`;
            img.onerror = () => img.remove();
            img.src = a.src;
            av.append(img);
          }
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = p.isLocal ? `${p.name} ${T.you}` : p.name;
          const flags = document.createElement('span');
          flags.className = 'flags';
          if (p.sharing) {
            const t = document.createElement('span');
            t.className = 'tag';
            t.textContent = T.live;
            flags.append(t);
          }
          if (p.muted) flags.insertAdjacentHTML('beforeend', I.smallOff);
          li.append(av, name, flags);
          ul.append(li);
        }
        if (people.length > MAX) {
          const more = document.createElement('li');
          more.className = 'more';
          more.textContent = T.more.replace('{n}', people.length - MAX);
          ul.append(more);
        }
        requestAnimationFrame(() => ocakOverlay.setHeight($('panel').offsetHeight + 2));
      }
      ocakOverlay.onStrings(applyStrings);
      ocakOverlay.onState(render);
    </script>
  </body>
</html>
